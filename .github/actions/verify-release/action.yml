name: Verify release package
description: Verify standalone release package structure and architecture, and smoke-test it on native runners.
inputs:
  package-file:
    description: 'Path to the release package file'
    required: true
  platform:
    description: 'Platform name (darwin/windows/linux)'
    required: true
  package-arch:
    description: 'Package architecture name (x86/x64/arm64)'
    required: true
runs:
  using: "composite"
  steps:
    - name: Verify release package
      shell: bash
      env:
        PACKAGE_FILE: ${{ inputs.package-file }}
        PLATFORM: ${{ inputs.platform }}
        PACKAGE_ARCH: ${{ inputs.package-arch }}
        RUNNER_OS_CONTEXT: ${{ runner.os }}
        RUNNER_ARCH_CONTEXT: ${{ runner.arch }}
      run: |
        set -euo pipefail
        source ./.github/actions/lib/release_platform.sh

        log_section "Verify release package"
        log_info "Package: $PACKAGE_FILE"
        log_info "Platform: $PLATFORM"
        log_info "Package arch: $PACKAGE_ARCH"

        WORKSPACE_DIR=$(pwd)
        PACKAGE_PATH="$WORKSPACE_DIR/$PACKAGE_FILE"
        if [ -f "$PACKAGE_FILE" ]; then
          PACKAGE_PATH="$PACKAGE_FILE"
        fi

        TARGET_PLATFORM="$(normalize_platform "$PLATFORM")"
        TARGET_ARCH="$(normalize_arch "$PACKAGE_ARCH")"
        RUNNER_PLATFORM="$(normalize_platform "$RUNNER_OS_CONTEXT")"
        RUNNER_ARCH="$(normalize_arch "$RUNNER_ARCH_CONTEXT")"
        SPX_BINARY_NAME="$(spx_binary_name_for_platform "$TARGET_PLATFORM")"
        VERIFY_BASENAME="release-verification-${TARGET_PLATFORM}-${TARGET_ARCH}"
        VERIFY_ROOT_DIR="$WORKSPACE_DIR/$VERIFY_BASENAME"
        VERIFY_TEST_ROOT_DIR="$VERIFY_ROOT_DIR/test"
        TEST_PROJECT_DIR="$VERIFY_TEST_ROOT_DIR/CI"
        VERIFY_LOG_PATH="$WORKSPACE_DIR/$VERIFY_BASENAME.log"
        STANDALONE_BIN_DIR="$VERIFY_ROOT_DIR/standalone-bin"

        log_info "Workspace: $WORKSPACE_DIR"
        log_info "Runner: $RUNNER_PLATFORM/$RUNNER_ARCH"
        log_info "Package target: $TARGET_PLATFORM/$TARGET_ARCH"

        if ! command -v unzip >/dev/null 2>&1; then
          log_error "unzip command is required but not available"
          exit 1
        fi

        if [ ! -f "$PACKAGE_PATH" ]; then
          log_error "package file not found: $PACKAGE_PATH"
          exit 1
        fi
        log_success "Package file found: $PACKAGE_PATH"

        rm -rf "$VERIFY_ROOT_DIR"
        mkdir -p "$VERIFY_ROOT_DIR"
        log_success "Created verification directory: $VERIFY_ROOT_DIR"

        log_section "Extract package"
        unzip -q "$PACKAGE_PATH" -d "$VERIFY_ROOT_DIR"
        log_success "Package extracted"

        log_info "Extracted top-level contents:"
        ls -la "$VERIFY_ROOT_DIR"

        SPX_BIN_PATH="$VERIFY_ROOT_DIR/$SPX_BINARY_NAME"

        if [ ! -f "$SPX_BIN_PATH" ]; then
          log_error "spx executable not found: $SPX_BIN_PATH"
          exit 1
        fi
        log_success "SPX executable found: $SPX_BIN_PATH"

        assert_binary_arch "$SPX_BIN_PATH" "$TARGET_PLATFORM" "$TARGET_ARCH"

        if [ "$TARGET_PLATFORM" != "windows" ]; then
          chmod +x "$SPX_BIN_PATH"
        fi

        if [ "$TARGET_PLATFORM" != "$RUNNER_PLATFORM" ] || [ "$TARGET_ARCH" != "$RUNNER_ARCH" ]; then
          log_info "Skipping smoke test on non-native runner"
          log_info "Runner platform/arch does not match package target"
          log_success "Release package verification passed"
          exit 0
        fi

        log_section "Prepare test project"
        mkdir -p "$VERIFY_TEST_ROOT_DIR"
        cp -R test/CI "$VERIFY_TEST_ROOT_DIR/"
        log_success "Test project copied"

        mkdir -p "$STANDALONE_BIN_DIR"
        STANDALONE_SPX="$STANDALONE_BIN_DIR/$(basename "$SPX_BIN_PATH")"
        cp "$SPX_BIN_PATH" "$STANDALONE_SPX"
        if [ "$TARGET_PLATFORM" != "windows" ]; then
          chmod +x "$STANDALONE_SPX"
        fi

        log_section "Run smoke test"
        log_info "Command: $STANDALONE_SPX run --path=$TEST_PROJECT_DIR --headless"

        rm -f "$VERIFY_LOG_PATH"
        set +e
        "$STANDALONE_SPX" run --path="$TEST_PROJECT_DIR" --headless 2>&1 | tee "$VERIFY_LOG_PATH"
        SPX_STATUS=${PIPESTATUS[0]}
        set -e

        SMOKE_REACHED_SUCCESS=false
        if spx_run_reached_success "$VERIFY_LOG_PATH"; then
          SMOKE_REACHED_SUCCESS=true
        fi

        if [ "$SPX_STATUS" -ne 0 ]; then
          if should_tolerate_windows_gdspxrt_shutdown_exit "$RUNNER_PLATFORM" "$VERIFY_LOG_PATH"; then
            log_warn "Smoke test reached success marker but exited with status $SPX_STATUS"
            log_info "Continuing because Windows gdspxrt can occasionally fail during shutdown after the project completed"
          else
            log_error "smoke test command failed (exit $SPX_STATUS)"
            log_info "Smoke test log:"
            cat "$VERIFY_LOG_PATH"
            exit 1
          fi
        fi

        if [ "$SMOKE_REACHED_SUCCESS" != true ]; then
          log_error "smoke test success marker not found"
          log_info "Smoke test log:"
          cat "$VERIFY_LOG_PATH"
          exit 1
        fi
        log_success "Smoke test success marker found"

        log_success "Release package verification passed"
